<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>衣服加工管理系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <!-- Flatpickr CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.css">
    <style>
        .sidebar {
            min-height: 100vh;
            background-color: #343a40;
            color: white;
        }
        .sidebar a {
            color: rgba(255,255,255,.8);
            text-decoration: none;
            padding: 10px 15px;
            display: block;
        }
        .text-balanced {
             color: #198754; /* Green for balanced/positive */
        }
        .text-returned {
             color: #dc3545; /* Red for returned/negative */
        }
        .text-issued {
             /* Default black/dark */
        }

        .sidebar a:hover, .sidebar a.active {
            background-color: #0d6efd;
            color: white;
        }
        .content {
            padding: 20px;
        }
        /* Custom Table Styles to remove heavy borders */
        .table thead th {
            border-top: none !important;
            border-bottom: 1px solid #dee2e6 !important;
        }
        .table td, .table th {
            border-top: 1px solid #dee2e6 !important;
            vertical-align: middle;
        }
        .table tbody td {
            height: 40px;
        }
        /* Completely remove border from the first row in sticky header scenarios if needed, 
           or ensure the bottom border of the header is thin */
        .table > thead > tr > th {
             border-bottom-width: 1px !important;
        }
        /* Remove border from table footer */
        .table tfoot tr td {
            border-bottom: none !important;
        }
        /* Rotate icon when collapsed/expanded */
        .rotate-icon {
            display: inline-block;
            transition: transform 0.3s ease;
            transform: rotate(0deg);
        }
        [aria-expanded="true"] .rotate-icon {
            transform: rotate(90deg);
        }
        .cursor-pointer {
            cursor: pointer;
        }
        /* Fix for flatpickr input jitter usually caused by box-sizing issues or missing styles on the alt input */
        .flatpickr-input {
            box-sizing: border-box; 
            min-height: calc(1.5em + .75rem + 2px); /* Standard Bootstrap form-control height */
        }
    </style>
</head>
<body class="bg-light">

<!-- Toast Container (Top Right) -->
<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1100;">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="toast align-items-center text-white bg-{{ category }} border-0" role="alert" aria-live="assertive" aria-atomic="true">
              <div class="d-flex">
                  <div class="toast-body">
                      {{ message }}
                  </div>
                  <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
              </div>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}
</div>

<div class="d-flex w-100 overflow-hidden">
    <div class="sidebar col-md-2 d-none d-md-block flex-shrink-0">
        <div class="p-3 text-center border-bottom border-secondary">
            <h4>管理系统</h4>
        </div>
        <nav class="mt-3">
            <a href="{{ url_for('hengji_index') }}" class="{{ 'active' if request.endpoint == 'hengji_index' else '' }}">横机加工管理</a>
            <a href="{{ url_for('taokou_index') }}" class="{{ 'active' if request.endpoint == 'taokou_index' else '' }}">套口加工管理</a>
        </nav>
    </div>
    
    <div class="col-md-10 content flex-grow-1" style="overflow-x: hidden;">
        {% block content %}{% endblock %}
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<!-- Flatpickr JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/l10n/zh.js"></script>

<script>
    // Initialize and show Toasts
    document.addEventListener('DOMContentLoaded', function() {
        var toastElList = [].slice.call(document.querySelectorAll('.toast'));
        var toastList = toastElList.map(function(toastEl) {
            // Auto hide after 3 seconds
            return new bootstrap.Toast(toastEl, { delay: 3000 });
        });
        toastList.forEach(function(toast) {
            toast.show();
        });
    });
</script>

{% block scripts %}{% endblock %}
</body>
</html>
