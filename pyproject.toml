[project]
name = "product-record-manager"
version = "0.1.0"
description = "a simple local web project using flask + sqlite"
dependencies = [
  "flask",
  "Flask-SQLAlchemy",
  "psycopg2-binary",
  "python-dotenv",
  "waitress",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app"]
